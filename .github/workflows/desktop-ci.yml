name: Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm run check:source
      - run: npm test
      - run: npm run test:accuracy
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:terminal
      - run: npm run test:bridge
      - if: runner.os == 'macOS'
        run: npm run test:terminal:mac-stress
      - if: runner.os == 'macOS'
        run: npm run test:tmux -- macOS
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm pack --dry-run

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: critical

  mac-artifacts:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run test:artifacts:mac
      - run: npm run test:terminal-restart
        env:
          LOADTOAGENT_TEST_EXECUTABLE: ${{ github.workspace }}/release/mac/LoadToAgent.app/Contents/MacOS/LoadToAgent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LoadToAgent-macOS
          path: |
            release/*.dmg
            release/*.zip
